services:
  postgres:
    image: postgres:16-alpine
    environment: [POSTGRES_PASSWORD=devpass, POSTGRES_DB=loans]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
  postgres-test:
    image: postgres:16-alpine
    environment: [POSTGRES_PASSWORD=testpass, POSTGRES_DB=loans_test]
    ports: ["5433:5432"]
    volumes: ["pgtestdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loans_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]

volumes:
  pgdata:
  pgtestdata:
